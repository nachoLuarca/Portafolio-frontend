server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React Router usa rutas del lado del cliente (/admin, /proyectos/:slug, etc.):
  # si nginx no encuentra el archivo, debe devolver index.html para que React
  # decida qué mostrar, en vez de dar un 404 real.
  location / {
    try_files $uri /index.html;
  }

  # Cachear assets compilados (tienen hash en el nombre, son seguros de cachear fuerte)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
